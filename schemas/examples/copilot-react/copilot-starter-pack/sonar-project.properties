# Adjust these values to match your org/project in SonarQube or SonarCloud.
sonar.projectKey=your-org_multi-tenant-agent-builder
sonar.projectName=multi-tenant-agent-builder
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src,server,backend
sonar.tests=src,server,backend
sonar.test.inclusions=**/*.test.*,**/*.spec.*

# Exclusions
sonar.exclusions=dist/**,build/**,coverage/**,node_modules/**,**/*.d.ts
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/index.*,dist/**,build/**,coverage/**

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Optional: wait for quality gate result in CI
sonar.qualitygate.wait=true

# Recommended server-side quality gate/profile settings for NEW CODE:
# - Coverage >= 80%
# - Duplicated lines <= 3%
# - Maintainability rating = A
# - Reliability rating = A
# - Security rating = A
# - No blocker or critical issues
# - Cognitive complexity rule threshold = 15
