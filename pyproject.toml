[project]
name = "codeless-orch"
version = "0.1.0"
description = "Codeless orchestration engine (LangGraph) - FastAPI scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "typing-extensions>=4.12",
  "structlog>=24.1.0",
  "jsonschema>=4.23.0",
  "langgraph>=1.0.0",
  "duckduckgo_search>=5.3.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "anyio>=4.4",
  "fakeredis>=2.23",
  "redis>=5.0",
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.uvicorn]
factory = false
reload = true

[dependency-groups]
dev = [
    "debugpy>=1.8.17",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
